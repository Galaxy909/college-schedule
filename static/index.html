<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0b0f19" />
  <title>Расписание</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: ['class', '[data-theme="dark"]'],
    }
  </script>
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <!-- PWA Manifest & Icons -->
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  
  <link rel="stylesheet" href="style.css" />
</head>
<body class="selection:bg-indigo-500 selection:text-white">

  <div class="max-w-xl mx-auto px-4 py-3 space-y-3 pb-16">

    <!-- ═══════════════════════════════════════
         1. Верхняя панель: Выбор группы + Настройки звонков + Тема
    ═══════════════════════════════════════ -->
    <header class="flex items-center justify-between gap-2 pt-1 pb-2 border-b border-slate-200/60 dark:border-slate-800/80">
      
      <!-- Выбор группы со стрелочкой -->
      <div class="relative">
        <button id="group-dropdown-btn" onclick="toggleGroupDropdown()"
          class="flex items-center gap-2 px-3.5 py-2 rounded-xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 hover:border-indigo-500 dark:hover:border-indigo-500 shadow-sm transition-all font-bold text-sm tracking-tight text-slate-900 dark:text-white">
          <span id="selected-group-name">Выбрать группу</span>
          <i data-lucide="chevron-down" class="w-4 h-4 text-slate-400 transition-transform duration-150" id="group-arrow"></i>
        </button>

        <!-- Выпадающее меню со списком групп и поиском -->
        <div id="group-dropdown-menu"
          class="hidden absolute left-0 top-full mt-2 w-64 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl shadow-2xl z-50 overflow-hidden flex flex-col">
          <div class="p-2 border-b border-slate-100 dark:border-slate-800">
            <div class="flex items-center gap-2 px-2.5 py-1.5 rounded-xl bg-slate-100 dark:bg-slate-800/80 text-xs">
              <i data-lucide="search" class="w-3.5 h-3.5 text-slate-400"></i>
              <input id="group-dropdown-search" type="text" placeholder="Поиск (напр. 911)..."
                oninput="filterDropdownGroups()"
                class="w-full bg-transparent focus:outline-none placeholder-slate-400 text-xs" />
            </div>
          </div>
          <div id="dropdown-groups-list" class="overflow-y-auto max-h-60 p-1 space-y-0.5 no-scrollbar"></div>
        </div>
      </div>

      <!-- Кнопки справа: Настройки звонков и Тема -->
      <div class="flex items-center gap-1.5">
        <button onclick="openBellSettings()"
          class="w-9 h-9 rounded-xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 flex items-center justify-center text-slate-600 hover:text-indigo-500 dark:text-slate-300 transition-colors shadow-sm"
          title="Настройка звонков">
          <i data-lucide="clock" class="w-4 h-4"></i>
        </button>

        <button onclick="toggleTheme()" id="theme-toggle"
          class="w-9 h-9 rounded-xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 flex items-center justify-center text-slate-600 hover:text-indigo-500 dark:text-slate-300 transition-colors shadow-sm"
          title="Сменить тему">
          <i data-lucide="sun" id="theme-icon" class="w-4 h-4"></i>
        </button>
      </div>

    </header>

    <!-- ═══════════════════════════════════════
         2. Просторный переключатель подгрупп [Все] [1 подгруппа] [2 подгруппа]
    ═══════════════════════════════════════ -->
    <div class="flex items-center p-1 rounded-xl bg-slate-200/60 dark:bg-slate-900 border border-slate-200/80 dark:border-slate-800 text-xs font-semibold shadow-inner">
      <button onclick="setSubgroup(0)" id="sg-0" class="flex-1 py-1.5 rounded-lg transition-all active-pill text-center">Все подгруппы</button>
      <button onclick="setSubgroup(1)" id="sg-1" class="flex-1 py-1.5 rounded-lg transition-all text-center">1 подгруппа</button>
      <button onclick="setSubgroup(2)" id="sg-2" class="flex-1 py-1.5 rounded-lg transition-all text-center">2 подгруппа</button>
    </div>

    <!-- ═══════════════════════════════════════
         3. Компактная статусная строка: Текущая пара
    ═══════════════════════════════════════ -->
    <div id="live-status-bar" class="hidden px-3.5 py-2 rounded-xl text-xs font-medium flex items-center justify-between border transition-all"></div>

    <!-- ═══════════════════════════════════════
         4. Календарная лента дней недели (Пн, Вт, Ср...)
    ═══════════════════════════════════════ -->
    <div class="space-y-1">
      <div id="days-ribbon" class="flex gap-1.5 overflow-x-auto no-scrollbar py-1">
        <!-- Дни генерируются динамически -->
      </div>
    </div>

    <!-- ═══════════════════════════════════════
         5. Список пар на выбранный день
    ═══════════════════════════════════════ -->
    <div id="day-schedule-content" class="space-y-2 pt-1">
      <div class="text-center py-20 text-slate-400 text-sm">
        Выбери группу вверху со стрелочкой ☝️
      </div>
    </div>

    <!-- Индикатор загрузки -->
    <div id="schedule-loader" class="hidden py-16 text-center text-xs text-slate-400 font-semibold tracking-wider uppercase space-y-2">
      <div class="w-6 h-6 border-2 border-indigo-500/20 border-t-indigo-500 rounded-full animate-spin mx-auto"></div>
      <p>Загрузка пар...</p>
    </div>

  </div>

  <!-- ═══════════════════════════════════════
       Модалка настройки времени звонков
  ═══════════════════════════════════════ -->
  <div id="bell-modal" class="fixed inset-0 z-50 hidden flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm">
    <div class="modal-card w-full max-w-sm p-5 space-y-4 shadow-2xl rounded-2xl">
      <div class="flex items-center justify-between border-b border-slate-200/50 dark:border-slate-800 pb-3">
        <div class="flex items-center gap-2">
          <i data-lucide="clock" class="w-5 h-5 text-indigo-500"></i>
          <h3 class="font-bold text-sm text-slate-900 dark:text-white">Время звонков</h3>
        </div>
        <button onclick="closeBellSettings()" class="text-slate-400 hover:text-slate-200 text-lg leading-none">&times;</button>
      </div>

      <p class="text-xs text-slate-400 leading-relaxed">
        Укажи время пар для твоего колледжа. Таймер автоматически пересчитается!
      </p>

      <div id="bell-inputs" class="space-y-2 max-h-60 overflow-y-auto pr-1 no-scrollbar">
        <!-- Генерируется в app.js -->
      </div>

      <div class="flex gap-2 pt-2">
        <button onclick="resetDefaultBells()" class="flex-1 py-2 rounded-xl border border-slate-200 dark:border-slate-800 text-xs font-semibold text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 transition">
          Сброс
        </button>
        <button onclick="saveBellSettings()" class="flex-1 py-2 rounded-xl bg-indigo-500 hover:bg-indigo-600 text-white text-xs font-bold transition">
          Сохранить
        </button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
